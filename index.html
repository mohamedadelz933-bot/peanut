<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسبة المقشرة</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--tx:#2b2118;--mu:#7d6d5d;--ac:#c2651d;--ac2:#e39a52;--bd:#eadfd2;--ok:#2e7d32;--bad:#c62828;--sh:0 2px 12px rgba(80,50,20,.09);box-sizing:border-box;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120e;--card:#241d16;--tx:#f3eadf;--mu:#ac9c8b;--ac:#e8954a;--ac2:#f0b073;--bd:#382e24;--ok:#6fcf74;--bad:#ff7b7b;--sh:0 2px 12px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120e;--card:#241d16;--tx:#f3eadf;--mu:#ac9c8b;--ac:#e8954a;--ac2:#f0b073;--bd:#382e24;--ok:#6fcf74;--bad:#ff7b7b;--sh:0 2px 12px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 18px;border-radius:0 0 24px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh)}
header b{font-size:19px}header .lg{font-size:26px;margin-inline-end:8px}#who{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700}
main{max-width:760px;margin:auto;padding:14px 12px 100px}
h3{margin:0 0 10px;font-size:15px;color:var(--ac)}h2{margin:2px 0 0;font-size:20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:6px 0;border-radius:12px;cursor:pointer}
nav button i{font-style:normal;font-size:21px;line-height:1.2}nav button.on{color:var(--ac);background:rgba(194,101,29,.13);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-top:3px}
input:focus,select:focus{outline:2px solid var(--ac2);border-color:var(--ac2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.row input,.row select{margin:0}.row .num{width:84px;flex:none}.row select{width:118px;flex:none}
.row button{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.add{width:100%;padding:10px;border:1px dashed var(--ac);background:none;color:var(--ac);border-radius:10px;font:inherit;cursor:pointer;margin-top:6px}
.save{width:100%;padding:13px;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.grid div{background:var(--bg);border-radius:12px;padding:10px;font-size:12px;color:var(--mu)}.grid b{display:block;font-size:15px;color:var(--tx)}
.bad,.bad b{color:var(--bad)}.ok,.ok b{color:var(--ok)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--mu);font-weight:600;background:var(--bg)}th,td{padding:6px 5px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
summary{cursor:pointer;font-weight:600;padding:2px 0}.mu{color:var(--mu);font-size:12px}.sw{display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--tx);font-size:14px}.sw input{width:auto;margin:0}
.sm{padding:4px 8px;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;font:inherit;cursor:pointer;font-size:12px}.sm.d{color:var(--bad)}.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--bg);font-size:13px;margin:2px}td .save,td .add{width:auto;display:inline-block;padding:8px 14px}
.hero{padding:2px 4px 12px}.hero small{color:var(--mu)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kp{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}.kp span{font-size:22px}.kp b{font-size:18px}.kp small{color:var(--mu);font-size:12px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.acts button{padding:12px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;font:inherit;font-size:13px;box-shadow:var(--sh);cursor:pointer}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts2 .add{margin:0}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.li:last-of-type{border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--sh)}.seg button{flex:1;border:0;background:none;color:var(--tx);padding:10px 4px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;font:inherit;box-shadow:var(--sh);cursor:pointer}.menu i{font-style:normal;font-size:30px}
</style></head><body><header><div><span class="lg">🥜</span><b>حسبة المقشرة</b></div><div id="who"></div></header>
<main><p id="st" class="bad"></p><div id="v"></div><p class="mu" id="ft">البيانات بتتحفظ على نفس الجهاز والمتصفح اللي بتفتح منه.</p></main>
<nav><button data-t="home" onclick="go('home')"><i>🏠</i><span>الرئيسية</span></button><button data-t="new" onclick="go('new')"><i>➕</i><span>تشغيلة</span></button><button data-t="stores" onclick="go('stores')"><i>📦</i><span>المخازن</span></button><button data-t="reports" onclick="go('reports')"><i>📊</i><span>التقارير</span></button><button data-t="more" onclick="go('more')"><i>☰</i><span>المزيد</span></button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
n=(x,d=1)=>isFinite(x)?(+x).toLocaleString('en-US',{maximumFractionDigits:d}):'-',m=x=>SP?n(x,2)+' ج':'•••';
let S={alloc:'w',runs:[],prices:[
{id:'raw1',name:'فول خام',t:'raw',p:45},
{id:'g1',name:'فول نمرة 1',t:'prod',p:70},{id:'g2',name:'فول نمرة 2',t:'prod',p:60},
{id:'g3',name:'فول نمرة 3',t:'prod',p:50},{id:'g4',name:'فول نمرة 4',t:'prod',p:40},
{id:'sh',name:'قشر',t:'shell',p:3},
{id:'c1',name:'عمالة',t:'cost',b:'kg',p:1.5},{id:'c2',name:'كهرباء وتشغيل الماكينة',t:'cost',b:'kg',p:0.6},{id:'c3',name:'تعبئة وتشوين',t:'cost',b:'run',p:50}]},tab='home';
let unU=null,MV={},SC={},EM='',CAN_ST=false,unMv=null,unSc=null,mig=0,DB=null,CAN_RUN=false,CAN_EDIT=false,CAN_ADD=false,ACC=false,SP=false,PERM=null,ME={},DID='',VW={},PM={},shown=0,got=0,pr=0,seeded=0,RM={},MN={},ITEMS=null,PR={},unM=null,unP=null,unR=null,unS=null;const timers={};
try{const a=JSON.parse(localStorage.getItem('mq1a'));if(a&&a.alloc)S.alloc=a.alloc}catch(e){}
const save=()=>{try{localStorage.setItem('mq1a',JSON.stringify({alloc:S.alloc}))}catch(e){}};
const newD=()=>({date:lt(new Date()),note:'',rawId:'',rawP:0,raw:0,moist:10,soaked:0,outs:{},shell:0});
let D=newD();
const P=t=>S.prices.filter(x=>x.t==t);
function mk(d){const r=P('raw').find(x=>x.id==d.rawId),sh=P('shell')[0];
return{...d,rawN:r?r.name:'',prods:P('prod').map(x=>({id:x.id,n:x.name,p:x.p,kg:d.outs[x.id]||0})),shellP:sh?sh.p:0,costs:P('cost').map(x=>({n:x.name,b:x.b,p:x.p}))}}
function calc(r){
const soak=r.soaked>0?r.soaked:r.raw*(1+r.moist/100),moist=r.raw>0?(soak/r.raw-1)*100:0,
kern=r.prods.reduce((a,x)=>a+x.kg,0),out=kern+r.shell,loss=soak-out,
rawCost=r.raw*r.rawP,proc=r.costs.reduce((a,c)=>a+c.p*(c.b=='kg'?r.raw:1),0),cost=rawCost+proc,
shellRev=r.shell*r.shellP,net=cost-shellRev,val=r.prods.reduce((a,x)=>a+x.kg*x.p,0),
ps=r.prods.map(x=>{const w=S.alloc=='v'?(val?x.kg*x.p/val:0):(kern?x.kg/kern:0),c=net*w;return{...x,c,cpk:x.kg?c/x.kg:0}}),
rev=val+shellRev;
return{raw:r.raw,shell:r.shell,soak,moist,kern,out,loss,lossP:soak?loss/soak*100:0,lossC:soak?loss*cost/soak:0,rawCost,proc,cost,net,avg:kern?net/kern:0,rev,profit:rev-cost,ps,shellRev}}
function resHTML(c){
const rows=c.ps.map(x=>`<tr><td>${esc(x.n)}<td>${n(x.kg)} (${n(c.raw?x.kg/c.raw*100:0)}%)<td>${m(x.c)}<td>${m(x.cpk)}<td class="${x.p-x.cpk<0?'bad':'ok'}">${m(x.p-x.cpk)}`).join('');
return `<div class="grid">
<div><b>${n(c.soak)} كجم</b>بعد النقع (رطوبة ${n(c.moist)}%)</div>
<div><b>${n(c.out)} كجم</b>إجمالي الناتج (${n(c.raw?c.out/c.raw*100:0)}% من الخام)</div>
<div class="${c.lossP>8||c.loss<0?'bad':''}"><b>${n(c.loss)} كجم · ${n(c.lossP)}%</b>الفقد</div>
<div><b>${m(c.lossC)}</b>تكلفة الفقد (تقريبي)</div>
<div><b>${m(c.cost)}</b>إجمالي تكلفة التشغيلة</div>
<div><b>${m(c.avg)}</b>متوسط تكلفة كجم الفول المقشر</div>
<div><b>${m(c.rev)}</b>إجمالي البيع المتوقع</div>
<div class="${c.profit<0?'bad':'ok'}"><b>${m(c.profit)}</b>صافي الربح</div></div>
${c.loss<0?'<p class="bad">الناتج أكبر من وزن الفول بعد النقع. زوّد نسبة الرطوبة أو اكتب الوزن الفعلي بعد النقع.</p>':''}
<div class="tw"><table><tr><th>الصنف<th>كجم (% من الخام)<th>إجمالي التكلفة<th>تكلفة الكجم<th>ربح الكجم${rows}<tr><td><b>الإجمالي</b><td>${n(c.kern)}<td>${m(c.net)}<td>${m(c.avg)}<td><tr><td>قشر (إيراد)<td>${n(c.shell)} (${n(c.raw?c.shell/c.raw*100:0)}%)<td>—<td>—<td>${m(c.shellRev)}</table></div>
<p class="mu">الخام ${m(c.rawCost)} + تشغيل ${m(c.proc)} − إيراد القشر ${m(c.shellRev)} = ${m(c.net)} بتتوزع على الأصناف.</p>
<label>توزيع التكلفة على الأصناف<select onchange="setAlloc(this.value)"><option value="w" ${S.alloc=='w'?'selected':''}>بالوزن (نفس تكلفة الكجم)</option><option value="v" ${S.alloc=='v'?'selected':''}>بالقيمة (حسب سعر البيع)</option></select></label>`}
function setAlloc(v){S.alloc=v;save();show()}
function formH(){
const R=P('raw');if(!R.find(x=>x.id==D.rawId)&&R[0]){D.rawId=R[0].id;D.rawP=R[0].p}
return `<div class="card"><div class="g2"><label>التاريخ<input type="date" data-k="date" value="${D.date}"></label><label>ملاحظة / المورد<input data-k="note" value="${esc(D.note)}"></label></div>
<div class="g2"><label>نوع الخام<select onchange="pickRaw(this.value)">${R.map(x=>`<option value="${x.id}" ${x.id==D.rawId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label style="${SP?'':'display:none'}">سعر كجم الخام<input id="rp" type="number" step="any" data-k="rawP" value="${D.rawP}"></label></div>
<p id="rbal" class="mu"></p><div class="g2"><label>كمية الخام (كجم)<input type="number" step="any" data-k="raw" value="${D.raw||''}"></label><label>رطوبة النقع التقديرية %<input type="number" step="any" data-k="moist" value="${D.moist}"></label></div>
<label>وزن الفول بعد النقع الفعلي (اختياري، لو كتبته بيلغي التقدير)<input type="number" step="any" data-k="soaked" value="${D.soaked||''}"></label></div>
<div class="card"><h3>المخرجات (كجم)</h3><div class="g2">${P('prod').map(x=>`<label>${esc(x.name)}<input type="number" step="any" data-k="o_${x.id}" value="${D.outs[x.id]||''}"></label>`).join('')}<label>القشر<input type="number" step="any" data-k="shell" value="${D.shell||''}"></label></div></div>
<div class="card" id="res"></div><p id="msg" class="bad"></p><button class="save" onclick="saveRun()">حفظ التشغيلة</button>`}
function upd(){$('#res').innerHTML=resHTML(calc(mk(D)));rbal()}
function pickRaw(id){D.rawId=id;D.rawP=S.prices.find(x=>x.id==id).p;$('#rp').value=D.rawP;upd()}
async function saveRun(){if(!(D.raw>0)){$('#msg').textContent='اكتب كمية الخام الأول.';return}
const r={...mk(D),id:Date.now(),no:nextNo()};
try{const{main,mon}=split(r),b=FS.batch();b.set(FS.doc('runs/'+r.id),main);if(SP)b.set(FS.doc('money/'+r.id),mon);await b.commit()}catch(e){$('#msg').textContent='تعذر الحفظ في السحابة. تأكد من صلاحية الكتابة وجرب مرة أخرى.';return}
const{date,moist,rawId,rawP}=D;D=newD();Object.assign(D,{date,moist,rawId,rawP});tab='runs';show()}
function runsH(){const L=S.runs;if(!L.length)return '<div class="card">لسه مفيش تشغيلات متسجلة.</div>';
const C=L.map(calc),T=k=>C.reduce((a,c)=>a+c[k],0);
return `<div class="card" id="tot"><h3>إجمالي ${L.length} تشغيلة</h3><div class="grid"><div><b>${n(L.reduce((a,r)=>a+r.raw,0))} كجم</b>خام</div><div><b>${n(T('loss')/T('soak')*100)}%</b>متوسط الفقد</div><div><b>${m(T('cost'))}</b>إجمالي التكلفة</div><div class="${T('profit')<0?'bad':'ok'}"><b>${m(T('profit'))}</b>إجمالي الربح</div></div><button class="save" id="xb" onclick="exportX()" style="display:${DL&&SP?'block':'none'}">⬇ تصدير التشغيلات إكسيل (${rgLabel()})</button><p id="xm" class="mu"></p></div>`+
L.map((r,i)=>`<details class="card" id="d${r.id}"><summary id="s${r.id}">${sumT(r,C[i])}</summary><br><div id="r${r.id}">${resHTML(C[i])}</div>${SP&&CAN_EDIT?editH(r):''}<button class="add" onclick="delRun(${r.id},this)">حذف التشغيلة</button></details>`).join('')}
async function delRun(id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='اضغط تاني للتأكيد';return}
try{const bt=FS.batch();bt.delete(FS.doc('runs/'+id));if(SP)bt.delete(FS.doc('money/'+id));await bt.commit()}catch(e){b.textContent='تعذر الحذف'}}
function priceH(){
const sec=(t,title)=>`<div class="card"><h3>${title}</h3>${P(t).map(x=>`<div class="row"><input value="${esc(x.name)}" data-p="${x.id}:name"><input class="num" type="number" step="any" value="${x.p}" data-p="${x.id}:p">${t=='cost'?`<select data-p="${x.id}:b"><option value="kg" ${x.b=='kg'?'selected':''}>لكل كجم خام</option><option value="run" ${x.b=='run'?'selected':''}>لكل تشغيلة</option></select>`:''}${t=='shell'?'':`<button onclick="delP('${x.id}')">✕</button>`}</div>`).join('')}${t=='shell'?'':`<button class="add" onclick="addP('${t}')">+ إضافة</button>`}</div>`;
return `<p class="mu">الأسعار دي أرقام مبدئية، عدّلها على أسعارك. التشغيلات المتسجلة بتحتفظ بأسعارها وقت التسجيل.</p>`+sec('raw','أنواع الخام (سعر شراء الكجم)')+sec('prod','الأصناف الناتجة (سعر بيع الكجم)')+sec('shell','القشر (سعر بيع الكجم)')+sec('cost','تكاليف التشغيل')}
function addP(t){S.prices.push({id:'x'+Date.now(),name:t=='raw'?'خام جديد':t=='prod'?'صنف جديد':'تكلفة جديدة',t,p:0,b:'kg'});save();pushPrices();show()}
function delP(id){S.prices=S.prices.filter(x=>x.id!=id);save();pushPrices();show()}
  function show(){const lock=DB&&!ACC;document.querySelector('nav').style.display=lock?'none':'';
if(lock){$('#v').innerHTML=lockH();return}
if(tab=='prices'&&!SP||tab=='acc'&&!ME.owner)tab='home';
const nm={runs:'more',prices:'more',acc:'more'}[tab]||tab;
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==nm));updNav();
$('#v').innerHTML=({home:homeH,new:formH,stores:storesH,reports:repH,more:moreH,runs:runsH,prices:priceH,acc:()=>namesH()+accH()}[tab]||homeH)();
if(tab=='new')upd();
const off=s=>document.querySelectorAll(s).forEach(e=>e.disabled=true);
if(tab=='new'&&!CAN_ADD)off('#v .save');
if(tab=='runs'&&!CAN_RUN)off('#v [data-r],#v .add');
if(tab=='prices'&&!CAN_EDIT){off('#v input,#v select,#v button');$('#v').insertAdjacentHTML('afterbegin','<p class=mu>تعديل الأسعار للمحرّر أو المالك فقط.</p>')}}
const onIn=e=>{const t=e.target,k=t.dataset.k,p=t.dataset.p;
if(k){const v=t.value;if(k.startsWith('o_'))D.outs[k.slice(2)]=+v||0;else D[k]=t.type=='number'?(+v||0):v;upd()}
else if(p){const[id,f]=p.split(':'),x=S.prices.find(y=>y.id==id);if(x){x[f]=f=='p'?(+t.value||0):t.value;save();pushPrices()}}};
const sumT=(r,c)=>`${r.no?'#'+r.no+' · ':''}${r.date} · ${esc(r.rawN||'')} ${esc(r.note)} · ${n(r.raw)} كجم · ربح ${m(c.profit)}`,
editH=r=>`<details style="margin-top:8px"><summary class="mu">تعديل أسعار التشغيلة دي</summary><div class="g2" style="margin-top:8px"><label>سعر كجم الخام<input type="number" step="any" data-r="${r.id}:rawP" value="${r.rawP}"></label>${r.prods.map((x,i)=>`<label>${esc(x.n)}<input type="number" step="any" data-r="${r.id}:p:${i}" value="${x.p}"></label>`).join('')}<label>القشر<input type="number" step="any" data-r="${r.id}:shellP" value="${r.shellP}"></label>${r.costs.map((x,i)=>`<label>${esc(x.n)} (${x.b=='kg'?'لكل كجم خام':'لكل تشغيلة'})<input type="number" step="any" data-r="${r.id}:c:${i}" value="${x.p}"></label>`).join('')}</div></details>`;

function issSheets(){const{by,rows}=issData(),ds=Object.keys(by),items=[...new Set(rows.map(v=>v.n||v.item))],A=[['الصنف'].concat(ds,['الإجمالي'])],B=[['الجهة','التاريخ','الصنف','الكمية','ملاحظة']];

function supSheets(){const{by,rows}=supData(),nm=Object.keys(by).sort((a,b)=>tq(by[b])-tq(by[a])),A=[['المورد','عدد التوريدات','إجمالي كجم','آخر توريد']],B=[['المورد','التاريخ','نوع الخام','الكمية','ملاحظة']];

a=[['رقم','التاريخ','ملاحظة / المورد','نوع الخام','الخام كجم','سعر كجم الخام','رطوبة %','كجم بعد النقع','إجمالي الناتج كجم','قشر كجم','الفقد كجم','الفقد %','تكلفة الفقد','تكلفة الخام','تكلفة التشغيل','إجمالي التكلفة','إيراد القشر','إجمالي البيع','صافي الربح']],

R.forEach((r,i)=>{const c=C[i];a.push([r.no||'',r.date,r.note,r.rawN,r.raw,r.rawP,c.moist,c.soak,c.out,c.shell,c.loss,c.lossP,c.lossC,c.rawCost,c.proc,c.cost,c.shellRev,c.rev,c.profit].map(rnd));

b.push([r.no||'',r.date,'قشر (إيراد)',r.shell,r.raw?r.shell/r.raw*100:0,r.shellP,'','','',c.shellRev].map(rnd))});return[a,b]}
